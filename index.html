<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luckshift</title>
  <meta name="description" content="Drift a die down a dark shaft while the face in play rewrites the rules.">
  <meta name="theme-color" content="#101614">
  <style>
    html, body { margin: 0; height: 100%; background: #101614; color: #efe7d6; font-family: Georgia, serif; }
    p { max-width: 28rem; margin: 0; padding: 2rem; line-height: 1.5; }
  </style>
</head>
<body>
  <p id="boot">Opening the shaft…</p>
  <script>
    const parts = ["p0", "p1", "p2", "p3", "p4", "p5", "p6"];
    Promise.all(parts.map((name) => fetch("slice/" + name + ".html").then((response) => {
      if (!response.ok) throw new Error(name);
      return response.text();
    }))).then((chunks) => {
      document.open();
      document.write(chunks.join(""));
      document.close();
    }).catch(() => {
      const boot = document.getElementById("boot");
      boot.textContent = "This page is HTML only. Serve the folder (python3 -m http.server) or open it on GitHub Pages. A double-clicked file cannot load the rest of the page.";
    });
  </script>
</body>
</html>
